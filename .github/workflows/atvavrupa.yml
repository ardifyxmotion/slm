name: atvavrupa

on:
  schedule:
    - cron: '7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atvavrupa-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q streamlink requests

      - name: Update HLS DVR
        run: python3 atvavrupa.py

      - name: Git Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A streams/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Sync ATV Avrupa HLS $(date -u +'%H:%M:%S')"
            git push
          fi
